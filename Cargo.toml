[package]
name = "wand-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A read-only, agent-first CLI for the Wiz GraphQL API"
license = "Apache-2.0"
repository = "https://github.com/ryanwersal/wand"
homepage = "https://github.com/ryanwersal/wand"
readme = "README.md"

[[bin]]
name = "wand"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
graphql-parser = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "time"] }
url = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = "symbols"
