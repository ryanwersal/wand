[tools]
rust = { version = "1.97.1", components = ["rustfmt", "clippy"] }
"cargo:cargo-audit" = "0.22.2"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-llvm-cov" = "0.9.0"

[tasks.check]
depends = ["lint", "test"]

[tasks.lint]
run = "cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo deny check bans licenses sources"

[tasks.test]
run = "cargo test"

[tasks.coverage]
run = "cargo llvm-cov --workspace --all-features --fail-under-lines 80"

[tasks.build]
run = "cargo build --release"

[tasks.audit]
run = "cargo audit"

[tasks.release]
description = "Bump the version, commit it, and push the release tag"
depends = ["check", "coverage", "audit"]
run = '''
#!/usr/bin/env bash
set -euo pipefail

if [[ $# -ne 1 || ! "$1" =~ ^(major|minor|patch)$ ]]; then
  echo "Usage: mise run release -- major|minor|patch" >&2
  exit 2
fi
release_kind="$1"

if ! git diff --quiet || ! git diff --cached --quiet; then
  echo "Working copy has uncommitted changes" >&2
  exit 1
fi

git fetch origin main
head_commit="$(git rev-parse HEAD)"
main_commit="$(git rev-parse refs/heads/main)"
origin_commit="$(git rev-parse refs/remotes/origin/main)"
if [[ "$head_commit" != "$main_commit" || "$main_commit" != "$origin_commit" ]]; then
  echo "HEAD, main, and origin/main must match before release" >&2
  exit 1
fi

current_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "wand-cli") | .version')"
IFS=. read -r major minor patch <<< "$current_version"
case "$release_kind" in
  major) next_version="$((major + 1)).0.0" ;;
  minor) next_version="${major}.$((minor + 1)).0" ;;
  patch) next_version="${major}.${minor}.$((patch + 1))" ;;
esac
NEXT_VERSION="$next_version" perl -pi -e 'if (!$updated && /^version = "/) { s/^version = "[^"]+"/version = "$ENV{NEXT_VERSION}"/; $updated = 1 }' Cargo.toml
cargo update --workspace
version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "wand-cli") | .version')"
if [[ "$version" != "$next_version" ]]; then
  echo "Expected version $next_version after bump, found $version" >&2
  exit 1
fi
git add Cargo.toml Cargo.lock
git commit -m "chore: release v${version}"
git push origin HEAD:main

version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "wand-cli") | .version')"
tag="v${version}"

git tag -a "$tag" -m "$tag"
git push origin "$tag"
'''
