[tools]
rust = "1.97.1"
"cargo:cargo-audit" = "0.22.2"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-llvm-cov" = "0.9.0"

[tasks.check]
depends = ["lint", "test"]

[tasks.lint]
run = "cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo deny check bans licenses sources"

[tasks.test]
run = "cargo test"

[tasks.coverage]
run = "cargo llvm-cov --workspace --all-features --fail-under-lines 80"

[tasks.build]
run = "cargo build --release"

[tasks.audit]
run = "cargo audit"

[tasks.release]
description = "Validate and push the Cargo version tag"
depends = ["check", "coverage", "audit"]
run = '''
#!/usr/bin/env bash
set -euo pipefail

if [[ -n "$(jj diff --summary)" ]]; then
  echo "Working copy has uncommitted changes" >&2
  exit 1
fi

main_commit="$(jj log -r main --no-graph -T 'commit_id')"
origin_commit="$(jj log -r 'main@origin' --no-graph -T 'commit_id')"
if [[ "$main_commit" != "$origin_commit" ]]; then
  echo "Local main must match origin/main before release" >&2
  exit 1
fi

version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "wand-cli") | .version')"
tag="v${version}"

jj tag set "$tag" -r main
jj git push --tag "$tag"
'''
